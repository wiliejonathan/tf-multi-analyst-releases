name: Publish REV466 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV466/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf466/src
          gh release download v1.17.78 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV465_MULTI_LINK.zip --output /tmp/tf466/base.zip
          echo '56fde56f375629652d7ab839d4c7ee65710403b3de9618da0b74465a33ebf17b  /tmp/tf466/base.zip' | sha256sum -c -
          unzip -q /tmp/tf466/base.zip -d /tmp/tf466/src
          python3 release-staging/REV466/patch466.py /tmp/tf466/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-rev457.js
          TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-summary463.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-losing464.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-picker465.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf466/src node release-staging/REV466/test-compact466.cjs
          find /tmp/tf466/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf466/src && zip -qr /tmp/TF_Extension_PC_MAC_REV466_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.79 /tmp/TF_Extension_PC_MAC_REV466_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.79 — REV466' --notes-file release-staging/REV466/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.79" > /tmp/tf466/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf466/previous.json
          python3 release-staging/REV466/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf466/latest-request.json
