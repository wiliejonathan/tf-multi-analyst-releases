name: Publish REV467 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV467/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf467/src
          gh release download v1.17.79 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV466_MULTI_LINK.zip --output /tmp/tf467/base.zip
          echo '7b284754366c0ea7608807b9786ec6ec61c317b670dfedf844e16244db458b64  /tmp/tf467/base.zip' | sha256sum -c -
          unzip -q /tmp/tf467/base.zip -d /tmp/tf467/src
          python3 release-staging/REV467/patch467.py /tmp/tf467/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-rev457.js
          TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-summary463.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-losing464.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-picker465.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-compact466.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf467/src node release-staging/REV467/test-progress467.cjs
          find /tmp/tf467/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf467/src && zip -qr /tmp/TF_Extension_PC_MAC_REV467_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.80 /tmp/TF_Extension_PC_MAC_REV467_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.80 — REV467' --notes-file release-staging/REV467/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.80" > /tmp/tf467/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf467/previous.json
          python3 release-staging/REV467/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf467/latest-request.json

