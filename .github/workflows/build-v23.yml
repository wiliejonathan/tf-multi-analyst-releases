name: Build TF Analyzer V30
on:
  push:
    branches: [chatgpt-build-v23]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Repair and reconstruct V23 patch bundle
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          expected='d6ab29cdecf80dc817dd3875e92bac34b5cfd71619b8755e148da6c6a28762dd'
          p='build-v23/chunk_03.txt'
          c=open(p,'rb').read().decode('ascii')
          if hashlib.sha256(c.encode()).hexdigest()!=expected:
              fixed=None
              for i in range(len(c)):
                  s=c[:i]+c[i+1:]
                  if hashlib.sha256(s.encode()).hexdigest()==expected:
                      fixed=s; break
              if fixed is None: raise SystemExit('Unable to repair chunk_03')
              c=fixed
          parts=[c if i==3 else open(f'build-v23/chunk_{i:02d}.txt','r',encoding='ascii').read() for i in range(7)]
          data=base64.b64decode(''.join(parts),validate=True)
          lzma.decompress(data)
          open('v23small.tar.xz','wb').write(data)
          PY
          tar -xJf v23small.tar.xz

      - name: Download REV224 base source
        run: |
          curl -L --fail -o rev224.zip https://github.com/wiliejonathan/tf-multi-analyst-releases/releases/download/v1.15.95/tf_multi_analyst_extension_rev224.zip
          mkdir -p rev224
          unzip -q rev224.zip -d rev224

      - name: Assemble V30 Android project
        run: |
          mkdir -p android_project/app/src/main/java/com/skillfusion/tfmultianalystmobil3 android_project/app/src/main/assets/www/assets android_project/app/src/main/res/values android_project/app/src/main/res/drawable
          cp v23small/native/root-build.gradle android_project/build.gradle
          cp v23small/native/settings.gradle android_project/settings.gradle
          cp v23small/native/gradle.properties android_project/gradle.properties
          cp v23small/native/app-build.gradle android_project/app/build.gradle
          cp v23small/native/AndroidManifest.xml android_project/app/src/main/AndroidManifest.xml
          cp v23small/native/styles.xml android_project/app/src/main/res/values/styles.xml
          cp v23small/native/MainActivity.java android_project/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          cp v23small/native/tfv23.jks android_project/app/tfv23.jks
          sed -i 's/applicationId "com.skillfusion.tfmultianalystmobil3"/applicationId "com.skillfusion.tfmultianalystmobil4"/' android_project/app/build.gradle
          sed -i "s/keyPassword 'TFv23-Key-2026!'/keyPassword 'TFv23-Store-2026!'/" android_project/app/build.gradle
          sed -i 's/versionCode 23/versionCode 30/' android_project/app/build.gradle
          sed -i 's/versionName "1.0.23"/versionName "1.0.30"/' android_project/app/build.gradle
          keytool -list -keystore android_project/app/tfv23.jks -storepass 'TFv23-Store-2026!' -alias tfv23 >/dev/null

          cp v23small/mobile/index.html android_project/app/src/main/assets/www/index.html
          cp v23small/mobile/mobile-overrides.css android_project/app/src/main/assets/www/mobile-overrides.css
          cp build-v29/mobile-chrome-shim-v29.js android_project/app/src/main/assets/www/mobile-chrome-shim.js
          cp build-v29/mobile-data-bridge-v29.js android_project/app/src/main/assets/www/mobile-data-bridge.js
          cp build-v30/mobile-import-fix-v30.js android_project/app/src/main/assets/www/mobile-import-fix-v30.js
          cp v23small/mobile/mobile-app-shell.js android_project/app/src/main/assets/www/mobile-app-shell.js
          cp build-v27/mobile-license-dual-slot.js android_project/app/src/main/assets/www/mobile-license-gate.js
          cat build-v28/mobile-device-approval.b64.* | base64 -d > android_project/app/src/main/assets/www/mobile-device-approval.js
          sed -i "s/mobileVersion:'1.0.27'/mobileVersion:'1.0.30'/g; s/mobileVersion:'1.0.28'/mobileVersion:'1.0.30'/g; s/mobileVersion:'1.0.29'/mobileVersion:'1.0.30'/g" android_project/app/src/main/assets/www/mobile-license-gate.js android_project/app/src/main/assets/www/mobile-device-approval.js || true

          cp rev224/assets/7e95b596e5bf8dff.css android_project/app/src/main/assets/www/assets/dashboard-original.css
          cp rev224/assets/4b4d6b8dc315a95c.js android_project/app/src/main/assets/www/assets/dashboard-mobile.js
          cp rev224/icon128.png android_project/app/src/main/res/drawable/tf_icon.png
          cp rev224/icon128.png android_project/app/src/main/assets/www/icon32.png
          xz -dc v23small/dashboard.patch.xz > dashboard.patch
          patch android_project/app/src/main/assets/www/assets/dashboard-mobile.js < dashboard.patch
          patch android_project/app/src/main/assets/www/assets/dashboard-mobile.js < build-v23/excel-native.patch
          cat build-v26/v25-frozen.css >> android_project/app/src/main/assets/www/mobile-overrides.css
          cat build-v26/mobile-license-gate.css >> android_project/app/src/main/assets/www/mobile-overrides.css
          cat build-v28/mobile-device-approval.css >> android_project/app/src/main/assets/www/mobile-overrides.css
          cat build-v30/mobile-import-v30.css >> android_project/app/src/main/assets/www/mobile-overrides.css

          python3 - <<'PY'
          from pathlib import Path
          p=Path('android_project/app/src/main/assets/www/index.html')
          s=p.read_text().replace('<html lang="id" data-tf-server-authorized="1" data-tf-license="valid">','<html lang="id">')
          old='<script src="mobile-chrome-shim.js"></script>\n<script src="assets/dashboard-mobile.js"></script>\n<script src="mobile-data-bridge.js"></script>\n<script src="mobile-app-shell.js"></script>'
          if old not in s: raise SystemExit('Expected mobile script block not found')
          new='<script src="mobile-license-gate.js"></script>\n<script src="mobile-device-approval.js"></script>\n<script src="mobile-import-fix-v30.js"></script>'
          p.write_text(s.replace(old,new))

          # Android file providers frequently expose .json as text/plain or
          # application/octet-stream. Let the picker show those files, while
          # JavaScript still validates the selected file as JSON.
          a=Path('android_project/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java')
          src=a.read_text()
          needle='intent.setType("application/json");'
          if needle not in src: raise SystemExit('JSON chooser MIME line not found')
          repl='intent.setType("*/*");\n                intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {"application/json", "text/json", "text/plain", "application/octet-stream"});'
          a.write_text(src.replace(needle,repl))
          PY

          node --check android_project/app/src/main/assets/www/mobile-chrome-shim.js
          node --check android_project/app/src/main/assets/www/mobile-data-bridge.js
          node --check android_project/app/src/main/assets/www/mobile-import-fix-v30.js
          node --check android_project/app/src/main/assets/www/mobile-license-gate.js
          node --check android_project/app/src/main/assets/www/mobile-device-approval.js
          grep -q 'indexeddb-v29' android_project/app/src/main/assets/www/mobile-chrome-shim.js
          grep -q 'tf-mobile-import-picker-v30' android_project/app/src/main/assets/www/mobile-import-fix-v30.js
          grep -q 'application/octet-stream' android_project/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          grep -q 'mobile-import-fix-v30.js' android_project/app/src/main/assets/www/index.html
          grep -q 'V25 - FROZEN/STICKY COLUMNS' android_project/app/src/main/assets/www/mobile-overrides.css
          grep -q 'AndroidSave.saveBase64' android_project/app/src/main/assets/www/mobile-app-shell.js
          grep -q 'ACTION_CREATE_DOCUMENT' android_project/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          test -s android_project/app/src/main/assets/www/icon32.png

      - name: Build signed V30 release APK
        working-directory: android_project
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TF_Analyzer_V30_IMPORT_FIXED
          path: android_project/app/build/outputs/apk/release/app-release.apk
