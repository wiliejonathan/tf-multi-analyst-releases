name: Publish REV468 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV468/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf468/src
          gh release download v1.17.80 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV467_MULTI_LINK.zip --output /tmp/tf468/base.zip
          echo 'afc0e7beb310aadcc65618acbb258a8fbad8f8d484bbe1b0bc07364fbf64c383  /tmp/tf468/base.zip' | sha256sum -c -
          unzip -q /tmp/tf468/base.zip -d /tmp/tf468/src
          python3 release-staging/REV468/patch468.py /tmp/tf468/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-rev457.js
          TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-summary463.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-losing464.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-picker465.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-compact466.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-progress467.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf468/src node release-staging/REV468/test-rescan468.cjs
          find /tmp/tf468/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf468/src && zip -qr /tmp/TF_Extension_PC_MAC_REV468_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.81 /tmp/TF_Extension_PC_MAC_REV468_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.81 — REV468' --notes-file release-staging/REV468/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.81" > /tmp/tf468/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf468/previous.json
          python3 release-staging/REV468/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf468/latest-request.json
