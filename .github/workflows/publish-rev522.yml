name: Publish REV522 restore continuous History table
on:
  push:
    branches: [main]
    paths: ['release-staging/REV522/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf522/src
          gh release download v1.18.34 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV521_MULTI_LINK.zip --output /tmp/tf522/base.zip
          echo '8248255f84860b489c08e19aa21bdacbf3242877800f89dc456736c5c66e4192  /tmp/tf522/base.zip' | sha256sum -c -
          unzip -q /tmp/tf522/base.zip -d /tmp/tf522/src
          python3 release-staging/REV522/patch522.py /tmp/tf522/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-unload522.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-lot522.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-viewer522.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-integration522.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-performance522.cjs
          TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-core-performance522.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-history522.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf522/src node release-staging/REV522/test-opened522.cjs
          (cd /tmp/tf522/src && zip -qr /tmp/TF_Extension_PC_MAC_REV522_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.35 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.35 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.35 — REV522' --notes-file release-staging/REV522/RELEASE_NOTES.md --latest
            gh release upload v1.18.35 /tmp/TF_Extension_PC_MAC_REV522_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.35 /tmp/TF_Extension_PC_MAC_REV522_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.35 — REV522' --notes-file release-staging/REV522/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.35" > /tmp/tf522/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf522/previous.json
          python3 release-staging/REV522/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf522/latest-request.json


