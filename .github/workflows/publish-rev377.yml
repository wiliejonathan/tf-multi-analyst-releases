name: Publish PC REV377 session expired login fix
on:
  push:
    paths:
      - 'release-staging/REV377/READY'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-pc-rev377
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify REV376 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.16.89 --pattern 'TF_Extension_PC_MAC_REV376_LOGIN_REQUIRED_AUTO_RESUME.zip' --output base.zip
          echo 'dad69055e400af60141d9eff16af312bae100d9af6a3439c8a8b240726b65520  base.zip' | sha256sum -c -
          python3 build_release_rev377.py base.zip
      - name: Validate packaged extension
        run: |
          rm -rf extension
          unzip -q deliverables/TF_Extension_PC_MAC_REV377_SESSION_EXPIRED_LOGIN_FIX.zip -d extension
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root=Path('extension')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['version']=='1.16.90'
          assert manifest['version_name']=='REV377'
          content=(root/'assets/dec74fd654ec6d54.js').read_text()
          bg=(root/'assets/901c62026afc22f4.js').read_text()
          popup=(root/'assets/927ecbd63036f61b.js').read_text()
          assert "if (!__tf_rev206_authProbe) return;" not in content[content.index('function tf_markLoggedOutAndNotify'):content.index('function tf_markLoggedOutAndNotify')+600]
          assert 'tfForceSidebarLoginView' in bg
          assert "forceLoginForm && (isSessionExpiredMsg || rootLoggedOut || accLoggedOut)" in popup
          assert "tfLoginError: msg" in popup
          loaders=[]
          for p in (root/'assets').glob('*.js'):
              s=p.read_text(errors='ignore')
              if 'const FILES =' in s and 'window.tfIntegrityReady' in s:
                  loaders.append(p)
          assert len(loaders)==1, loaders
          s=loaders[0].read_text()
          files=json.loads(re.search(r'const FILES = (\{.*?\});',s,re.S).group(1))
          for path,digest in re.findall(r'FILES\[["\']([^"\']+)["\']\]\s*=\s*["\']([0-9a-f]{64})["\']\s*;',s):
              files[path]=digest
          mismatch=[]
          for path,expected in files.items():
              f=root/path
              actual=hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else 'MISSING'
              if actual!=expected: mismatch.append((path,expected,actual))
          assert not mismatch, mismatch
          print('Protected integrity PASS:',len(files),'entries')
          PY
          for file in extension/assets/*.js; do node --check "$file"; done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.16.90 >/dev/null 2>&1; then
            echo 'Release v1.16.90 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.16.90 deliverables/TF_Extension_PC_MAC_REV377_SESSION_EXPIRED_LOGIN_FIX.zip --target "$GITHUB_SHA" --title 'TF Analyzer Analyst v1.16.90 — REV377 Session Expired Login Fix' --notes-file deliverables/RELEASE_NOTES_REV377.md --latest
      - name: Publish update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.16.90 > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release.json').read_text())
          a=next(a for a in r['assets'] if a['name']=='TF_Extension_PC_MAC_REV377_SESSION_EXPIRED_LOGIN_FIX.zip')
          assert a['state']=='uploaded' and a['size']>0
          data={'schema':1,'available':True,'revision':377,'tag_name':r['tag_name'],'release_url':r['html_url'],'published_at':r['published_at'],'asset':{'id':a['id'],'name':a['name'],'url':a['browser_download_url'],'size':a['size'],'digest':a.get('digest',''),'updated_at':a['updated_at']}}
          Path('/tmp/latest-rev377.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          cp /tmp/latest-rev377.json latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m 'Publish verified REV377 update metadata'
          git push origin HEAD:main
