name: Publish REV543 multi-link timer and indicator export fixes
on:
  push:
    branches: [main]
    paths: ['release-staging/REV543/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact verified package and run regression checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf543/src
          gh release download v1.18.49 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV536_MULTI_LINK.zip --output /tmp/tf543/base.zip
          echo '397c9ed172f09435b22ede6643e51e7c91f0c9f397b8163a7b6d73fc46e37190  /tmp/tf543/base.zip' | sha256sum -c -
          unzip -q /tmp/tf543/base.zip -d /tmp/tf543/src
          cp -a release-staging/REV543/overlay/. /tmp/tf543/src/
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('/tmp/tf543/src')
          expected=json.loads(Path('release-staging/REV543/FILE_HASHES.json').read_text())
          actual={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert actual==expected, 'Package differs from tested files'
          PY
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf543/src node release-staging/REV543/test537.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf543/src node release-staging/REV543/test538.cjs
          TF_REV419_ROOT=/tmp/tf543/src node release-staging/REV543/test-codec.cjs
          (cd /tmp/tf543/src && zip -qr /tmp/TF_Extension_PC_MAC_REV543_MULTI_LINK.zip .)
      - name: Publish release and latest metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.18.56 /tmp/TF_Extension_PC_MAC_REV543_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.56 — REV543' --notes-file release-staging/REV543/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.56" > /tmp/tf543/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf543/previous.json
          python3 release-staging/REV543/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf543/latest-request.json
