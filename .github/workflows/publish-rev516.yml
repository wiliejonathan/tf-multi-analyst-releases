name: Publish REV516 Monday-aligned calendar with weekday headers
on:
  push:
    branches: [main]
    paths: ['release-staging/REV516/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf516/src
          gh release download v1.18.28 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV515_MULTI_LINK.zip --output /tmp/tf516/base.zip
          echo '22662755fc02940cb6c64581acbad172701128f82afad2f24f19de0d4c4a6c1b  /tmp/tf516/base.zip' | sha256sum -c -
          unzip -q /tmp/tf516/base.zip -d /tmp/tf516/src
          python3 release-staging/REV516/patch516.py /tmp/tf516/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf516/src node release-staging/REV516/test-unload516.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf516/src node release-staging/REV516/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf516/src node release-staging/REV516/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf516/src node release-staging/REV516/test-lot516.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf516/src node release-staging/REV516/test-viewer516.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf516/src node release-staging/REV516/test-integration516.cjs
          (cd /tmp/tf516/src && zip -qr /tmp/TF_Extension_PC_MAC_REV516_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.29 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.29 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.29 — REV516' --notes-file release-staging/REV516/RELEASE_NOTES.md --latest
            gh release upload v1.18.29 /tmp/TF_Extension_PC_MAC_REV516_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.29 /tmp/TF_Extension_PC_MAC_REV516_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.29 — REV516' --notes-file release-staging/REV516/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.29" > /tmp/tf516/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf516/previous.json
          python3 release-staging/REV516/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf516/latest-request.json


