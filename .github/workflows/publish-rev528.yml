name: Publish REV528 Pine exports and indicator builder fixes
on:
  push:
    branches: [main]
    paths: ['release-staging/REV528/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf528/src
          gh release download v1.18.40 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV527_MULTI_LINK.zip --output /tmp/tf528/base.zip
          echo 'f6ee805b4526a07f5893c9582312bad8de99755e48156ed79b5b987100bcfca7  /tmp/tf528/base.zip' | sha256sum -c -
          unzip -q /tmp/tf528/base.zip -d /tmp/tf528/src
          python3 release-staging/REV528/patch528.py /tmp/tf528/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-unload525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-lot525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-viewer525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-integration525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-performance525.cjs
          TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-core-performance525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-history525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-smooth525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-stability525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-opened525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-cancelled525.cjs
          mkdir -p work/report528
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-navigation528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-builder528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-template528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf528/src node release-staging/REV528/test-source528.cjs
          (cd /tmp/tf528/src && zip -qr /tmp/TF_Extension_PC_MAC_REV528_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.41 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.41 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.41 — REV528' --notes-file release-staging/REV528/RELEASE_NOTES.md --latest
            gh release upload v1.18.41 /tmp/TF_Extension_PC_MAC_REV528_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.41 /tmp/TF_Extension_PC_MAC_REV528_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.41 — REV528' --notes-file release-staging/REV528/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.41" > /tmp/tf528/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf528/previous.json
          python3 release-staging/REV528/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf528/latest-request.json


