name: Publish REV532 compact TradingView panel and hide control
on:
  push:
    branches: [main]
    paths: ['release-staging/REV532/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf532/src
          gh release download v1.18.44 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV531_MULTI_LINK.zip --output /tmp/tf532/base.zip
          echo '16bbefd5bfb3eabd6faff546679594f7a2c7cbeedd118c0000407c2bf7fce484  /tmp/tf532/base.zip' | sha256sum -c -
          unzip -q /tmp/tf532/base.zip -d /tmp/tf532/src
          python3 release-staging/REV532/patch532.py /tmp/tf532/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-unload525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-lot525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-viewer525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-integration525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-performance525.cjs
          TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-core-performance525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-history525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-smooth525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-stability525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-opened525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-cancelled525.cjs
          mkdir -p work/report528 work/report530
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-navigation528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-builder528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-template528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-source528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-ui530.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-shared-nav531.cjs
          mkdir -p work/report532
          TF_REV419_ROOT=/tmp/tf532/src node release-staging/REV532/test-mobile-panel532.cjs
          (cd /tmp/tf532/src && zip -qr /tmp/TF_Extension_PC_MAC_REV532_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.45 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.45 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.45 — REV532' --notes-file release-staging/REV532/RELEASE_NOTES.md --latest
            gh release upload v1.18.45 /tmp/TF_Extension_PC_MAC_REV532_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.45 /tmp/TF_Extension_PC_MAC_REV532_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.45 — REV532' --notes-file release-staging/REV532/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.45" > /tmp/tf532/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf532/previous.json
          python3 release-staging/REV532/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf532/latest-request.json


