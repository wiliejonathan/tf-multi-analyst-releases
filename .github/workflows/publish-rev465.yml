name: Publish REV465 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV465/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf465/src
          gh release download v1.17.77 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV464_MULTI_LINK.zip --output /tmp/tf465/base.zip
          echo '3c35395221144fad344cde3f7763a1f86b1985eddbc30baba30c1e42093adb2d  /tmp/tf465/base.zip' | sha256sum -c -
          unzip -q /tmp/tf465/base.zip -d /tmp/tf465/src
          python3 release-staging/REV465/patch465.py /tmp/tf465/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-rev457.js
          TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-summary463.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-losing464.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf465/src node release-staging/REV465/test-picker465.cjs
          find /tmp/tf465/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf465/src && zip -qr /tmp/TF_Extension_PC_MAC_REV465_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.78 /tmp/TF_Extension_PC_MAC_REV465_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.78 — REV465' --notes-file release-staging/REV465/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.78" > /tmp/tf465/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf465/previous.json
          python3 release-staging/REV465/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf465/latest-request.json
