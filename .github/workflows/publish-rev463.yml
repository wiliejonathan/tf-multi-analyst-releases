name: Publish REV463 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV463/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf463/src
          gh release download v1.17.75 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV462_MULTI_LINK.zip --output /tmp/tf463/base.zip
          echo '255daa8a542c0ab6aed284723d1bbaaea08fd235acea0df5fa04851a9c38287f  /tmp/tf463/base.zip' | sha256sum -c -
          unzip -q /tmp/tf463/base.zip -d /tmp/tf463/src
          python3 release-staging/REV463/patch463.py /tmp/tf463/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-rev457.js
          TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf463/src node release-staging/REV463/test-summary463.cjs
          find /tmp/tf463/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf463/src && zip -qr /tmp/TF_Extension_PC_MAC_REV463_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.76 /tmp/TF_Extension_PC_MAC_REV463_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.76 — REV463' --notes-file release-staging/REV463/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.76" > /tmp/tf463/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf463/previous.json
          python3 release-staging/REV463/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf463/latest-request.json
