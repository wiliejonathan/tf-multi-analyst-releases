name: Publish REV520 low-end performance optimizations
on:
  push:
    branches: [main]
    paths: ['release-staging/REV520/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf520/src
          gh release download v1.18.32 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV519_MULTI_LINK.zip --output /tmp/tf520/base.zip
          echo '754851703c7f475edff5d0f60e2c65e9a2180d7986b1babf27c291b87517ca3e  /tmp/tf520/base.zip' | sha256sum -c -
          unzip -q /tmp/tf520/base.zip -d /tmp/tf520/src
          python3 release-staging/REV520/patch520.py /tmp/tf520/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-unload520.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-lot520.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-viewer520.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-integration520.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-performance520.cjs
          TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-core-performance520.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf520/src node release-staging/REV520/test-paging520.cjs
          (cd /tmp/tf520/src && zip -qr /tmp/TF_Extension_PC_MAC_REV520_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.33 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.33 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.33 — REV520' --notes-file release-staging/REV520/RELEASE_NOTES.md --latest
            gh release upload v1.18.33 /tmp/TF_Extension_PC_MAC_REV520_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.33 /tmp/TF_Extension_PC_MAC_REV520_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.33 — REV520' --notes-file release-staging/REV520/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.33" > /tmp/tf520/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf520/previous.json
          python3 release-staging/REV520/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf520/latest-request.json


