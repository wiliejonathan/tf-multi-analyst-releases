name: Publish REV499 separate filter outlines and compact dashboard
on:
  push:
    branches: [main]
    paths: ['release-staging/REV499/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf499/src
          gh release download v1.17.85 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV472_MULTI_LINK.zip --output /tmp/tf499/base.zip
          echo 'ab12568ee3392201e567b9a8aa14653afadfeef5fcc881e0a60f25c9b4d0c32f  /tmp/tf499/base.zip' | sha256sum -c -
          unzip -q /tmp/tf499/base.zip -d /tmp/tf499/src
          python3 release-staging/REV499/patch499.py /tmp/tf499/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-recovery457.cjs
          TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-submit-worker499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-submit499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-pairs499.cjs
          TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-flow499.cjs
          TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-rank499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-empty499.cjs
          TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-profit499.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-switch499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-switch499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-report499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-scroll499.cjs
          TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-stop499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-stop-ui499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-report499.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf499/src node release-staging/REV499/test-scroll499.cjs
          find /tmp/tf499/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf499/src && zip -qr /tmp/TF_Extension_PC_MAC_REV499_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.12 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.12 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.12 — REV499' --notes-file release-staging/REV499/RELEASE_NOTES.md --latest
            gh release upload v1.18.12 /tmp/TF_Extension_PC_MAC_REV499_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.12 /tmp/TF_Extension_PC_MAC_REV499_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.12 — REV499' --notes-file release-staging/REV499/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.12" > /tmp/tf499/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf499/previous.json
          python3 release-staging/REV499/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf499/latest-request.json


