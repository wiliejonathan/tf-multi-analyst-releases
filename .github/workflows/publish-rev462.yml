name: Publish REV462 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV462/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf462/src
          gh release download v1.17.74 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV461_MULTI_LINK.zip --output /tmp/tf462/base.zip
          echo 'dd77961201233044ee65163b2f869a4486fc44b9e017fd3eef6895d0763f412c  /tmp/tf462/base.zip' | sha256sum -c -
          unzip -q /tmp/tf462/base.zip -d /tmp/tf462/src
          python3 release-staging/REV462/patch462.py /tmp/tf462/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-rev457.js
          TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf462/src node release-staging/REV462/test-rows462.cjs
          find /tmp/tf462/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf462/src && zip -qr /tmp/TF_Extension_PC_MAC_REV462_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.75 /tmp/TF_Extension_PC_MAC_REV462_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.75 — REV462' --notes-file release-staging/REV462/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.75" > /tmp/tf462/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf462/previous.json
          python3 release-staging/REV462/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf462/latest-request.json
