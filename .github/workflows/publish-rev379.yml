name: Publish PC REV379 DOM logout sidebar login fix
on:
  push:
    paths:
      - 'release-staging/REV379/READY'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-pc-rev379
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify REV378 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.16.91 --pattern 'TF_Extension_PC_MAC_REV378_PAIR_SELECTOR_LABEL_FIX.zip' --output base.zip
          echo 'f2f5f536de08bbd7a2c1c58e34013cf62168314c22dcb267eb24bef71c00c6ca  base.zip' | sha256sum -c -
          python3 build_release_rev379.py base.zip
          echo '531d5cbe418af77d4e32d987161b4bbf6166ed3390691954a9b8260d55686ac8  deliverables/TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' | sha256sum -c -
      - name: Validate packaged extension
        run: |
          rm -rf extension
          unzip -q deliverables/TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip -d extension
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root=Path('extension')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['version']=='1.16.92'
          assert manifest['version_name']=='REV379'
          helper=(root/'assets/tf-login-helper-rev205.js').read_text()
          popup=(root/'assets/927ecbd63036f61b.js').read_text()
          start=helper.index('function detectLoginState()')
          assert "if (!__tf_isAuthTab && !__tf_isLogoutPath && !__tf_isProfileProbe) return;" not in helper[start:start+350]
          assert "Silahkan\\s+login\\s+untuk\\s+mengakses\\s+halaman\\s+ini" in helper
          assert "ordinary/stale account tabs remain passive" in helper
          func=popup[popup.index('const tf_forceLoginViewForResume'):popup.index('const onUpdateClick')]
          assert func.index('const msg = String(') < func.index('try { tf_queueResumeAfterLogin')
          assert 'tfLoginError: msg' in func
          loaders=[]
          for p in (root/'assets').glob('*.js'):
              s=p.read_text(errors='ignore')
              if 'const FILES =' in s and 'window.tfIntegrityReady' in s:
                  loaders.append(p)
          assert len(loaders)==1, loaders
          s=loaders[0].read_text()
          files=json.loads(re.search(r'const FILES = (\{.*?\});',s,re.S).group(1))
          for path,digest in re.findall(r'FILES\[["\']([^"\']+)["\']\]\s*=\s*["\']([0-9a-f]{64})["\']\s*;',s):
              files[path]=digest
          mismatch=[]
          for path,expected in files.items():
              f=root/path
              actual=hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else 'MISSING'
              if actual!=expected: mismatch.append((path,expected,actual))
          assert not mismatch, mismatch
          print('Protected integrity PASS:',len(files),'entries')
          PY
          for file in extension/assets/*.js; do node --check "$file"; done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.16.92 >/dev/null 2>&1; then
            echo 'Release v1.16.92 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.16.92 deliverables/TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip --target "$GITHUB_SHA" --title 'TF Analyzer Analyst v1.16.92 — REV379 DOM Logout Sidebar Login Fix' --notes-file deliverables/RELEASE_NOTES_REV379.md --latest
      - name: Publish update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.16.92 > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release.json').read_text())
          a=next(a for a in r['assets'] if a['name']=='TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip')
          assert a['state']=='uploaded' and a['size']>0
          assert a.get('digest','') in ('','sha256:531d5cbe418af77d4e32d987161b4bbf6166ed3390691954a9b8260d55686ac8')
          data={'schema':1,'available':True,'revision':379,'tag_name':r['tag_name'],'release_url':r['html_url'],'published_at':r['published_at'],'asset':{'id':a['id'],'name':a['name'],'url':a['browser_download_url'],'size':a['size'],'digest':a.get('digest',''),'updated_at':a['updated_at']}}
          Path('/tmp/latest-rev379.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          cp /tmp/latest-rev379.json latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m 'Publish verified REV379 update metadata'
          git push origin HEAD:main
