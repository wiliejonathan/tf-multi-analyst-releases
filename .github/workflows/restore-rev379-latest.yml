name: Restore PC REV379 as official latest
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/RESTORE-REV379/READY'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore official PC release pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.16.93 --title 'RETIRED — Mobile-only experiment; do not install on PC' --prerelease
          gh release edit v1.16.92 --latest
          python3 - <<'PY'
          import json
          from pathlib import Path
          data={
            "schema":1,
            "available":True,
            "revision":379,
            "tag_name":"v1.16.92",
            "release_url":"https://github.com/wiliejonathan/tf-multi-analyst-releases/releases/tag/v1.16.92",
            "published_at":"2026-09-17T19:23:16Z",
            "asset":{
              "id":570929663,
              "name":"TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip",
              "url":"https://github.com/wiliejonathan/tf-multi-analyst-releases/releases/download/v1.16.92/TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip",
              "size":811704,
              "digest":"sha256:531d5cbe418af77d4e32d987161b4bbf6166ed3390691954a9b8260d55686ac8",
              "updated_at":"2026-09-17T19:23:15Z"
            }
          }
          Path('latest.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git diff --cached --quiet || git commit -m 'Restore official PC latest to REV379'
          git push origin HEAD:main
