name: Publish REV512 full-height calendar and monthly performance
on:
  push:
    branches: [main]
    paths: ['release-staging/REV512/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf512/src
          gh release download v1.18.24 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV511_MULTI_LINK.zip --output /tmp/tf512/base.zip
          echo '7aa8b76c8fc06df2d53c3bcf747912f872df4f8a5b9a816220faa236fd8c26d9  /tmp/tf512/base.zip' | sha256sum -c -
          unzip -q /tmp/tf512/base.zip -d /tmp/tf512/src
          python3 release-staging/REV512/patch512.py /tmp/tf512/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf512/src node release-staging/REV512/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf512/src node release-staging/REV512/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf512/src node release-staging/REV512/test-lot512.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf512/src node release-staging/REV512/test-viewer512.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf512/src node release-staging/REV512/test-integration512.cjs
          (cd /tmp/tf512/src && zip -qr /tmp/TF_Extension_PC_MAC_REV512_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.25 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.25 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.25 — REV512' --notes-file release-staging/REV512/RELEASE_NOTES.md --latest
            gh release upload v1.18.25 /tmp/TF_Extension_PC_MAC_REV512_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.25 /tmp/TF_Extension_PC_MAC_REV512_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.25 — REV512' --notes-file release-staging/REV512/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.25" > /tmp/tf512/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf512/previous.json
          python3 release-staging/REV512/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf512/latest-request.json


