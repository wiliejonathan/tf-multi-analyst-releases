name: Publish REV489 Medal filters and compact results
on:
  push:
    branches: [main]
    paths: ['release-staging/REV489/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf489/src
          gh release download v1.17.85 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV472_MULTI_LINK.zip --output /tmp/tf489/base.zip
          echo 'ab12568ee3392201e567b9a8aa14653afadfeef5fcc881e0a60f25c9b4d0c32f  /tmp/tf489/base.zip' | sha256sum -c -
          unzip -q /tmp/tf489/base.zip -d /tmp/tf489/src
          python3 release-staging/REV489/patch489.py /tmp/tf489/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          TF_REV419_ROOT=/tmp/tf489/src node release-staging/REV489/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf489/src node release-staging/REV489/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf489/src node release-staging/REV489/test-recovery457.cjs
          TF_REV419_ROOT=/tmp/tf489/src node release-staging/REV489/test-submit-worker489.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf489/src node release-staging/REV489/test-submit489.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf489/src node release-staging/REV489/test-filters489.cjs
          mkdir -p outputs
          find /tmp/tf489/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf489/src && zip -qr /tmp/TF_Extension_PC_MAC_REV489_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.02 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.02 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.02 — REV489' --notes-file release-staging/REV489/RELEASE_NOTES.md --latest
            gh release upload v1.18.02 /tmp/TF_Extension_PC_MAC_REV489_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.02 /tmp/TF_Extension_PC_MAC_REV489_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.02 — REV489' --notes-file release-staging/REV489/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.02" > /tmp/tf489/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf489/previous.json
          python3 release-staging/REV489/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf489/latest-request.json


