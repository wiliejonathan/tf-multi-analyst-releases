name: Publish REV515 login helper pagehide cleanup without unload warnings
on:
  push:
    branches: [main]
    paths: ['release-staging/REV515/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf515/src
          gh release download v1.18.27 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV514_MULTI_LINK.zip --output /tmp/tf515/base.zip
          echo 'aadff528e7ac01b91b79b854c39c9a6770f940ef15177c2bebfc58e496bbc538  /tmp/tf515/base.zip' | sha256sum -c -
          unzip -q /tmp/tf515/base.zip -d /tmp/tf515/src
          python3 release-staging/REV515/patch515.py /tmp/tf515/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf515/src node release-staging/REV515/test-unload515.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf515/src node release-staging/REV515/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf515/src node release-staging/REV515/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf515/src node release-staging/REV515/test-lot515.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf515/src node release-staging/REV515/test-viewer515.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf515/src node release-staging/REV515/test-integration515.cjs
          (cd /tmp/tf515/src && zip -qr /tmp/TF_Extension_PC_MAC_REV515_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.28 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.28 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.28 — REV515' --notes-file release-staging/REV515/RELEASE_NOTES.md --latest
            gh release upload v1.18.28 /tmp/TF_Extension_PC_MAC_REV515_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.28 /tmp/TF_Extension_PC_MAC_REV515_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.28 — REV515' --notes-file release-staging/REV515/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.28" > /tmp/tf515/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf515/previous.json
          python3 release-staging/REV515/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf515/latest-request.json


