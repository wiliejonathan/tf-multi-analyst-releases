name: Publish PC Mac REV384 Holding alignment
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV384/READY'
permissions:
  contents: write
concurrency:
  group: publish-pc-rev384
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download REV383 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev384
          rm -rf "$ROOT" && mkdir -p "$ROOT/src"
          gh release download v1.16.96 --repo "$GITHUB_REPOSITORY" --pattern 'TF_Extension_PC_MAC_REV383_HOLDING_NO_SCROLL_HISTORY_PERF_FIX.zip' --output "$ROOT/base.zip"
          unzip -tq "$ROOT/base.zip"
          unzip -q "$ROOT/base.zip" -d "$ROOT/src"
      - name: Patch REV384
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, re
          root=Path('/tmp/tf-rev384/src')
          css=root/'assets/tf-mechanical-theme.css'
          s=css.read_text()
          s=s.replace('/* REV383 — Original plugin theme + selective table glow + compact neon custom cursor. */','/* REV384 — Original plugin theme + selective table glow + precisely aligned Holding analytics. */',1)
          old='''  .tf-holding-table { width:100%; min-width:0!important; table-layout:fixed; font-size:11px; }\n  .tf-holding-table th, .tf-holding-table td { padding:9px 10px; }\n  .tf-holding-table th:first-child, .tf-holding-table td:first-child { width:48%; overflow-wrap:anywhere; word-break:normal; }\n  .tf-holding-table th:nth-child(2), .tf-holding-table th:nth-child(3) { width:26%; text-align:center!important; }\n  .tf-holding-value { text-align:right; }\n  .tf-holding-analyst { font-weight:700; }\n  .tf-holding-value { white-space:nowrap; }\n'''
          new='''  .tf-holding-table { width:100%; min-width:0!important; table-layout:fixed; border-collapse:collapse; font-size:11px; }\n  .tf-holding-table th, .tf-holding-table td { box-sizing:border-box; padding:9px 10px; vertical-align:middle; line-height:1.35; }\n  .tf-holding-table th:first-child, .tf-holding-table td:first-child { width:48%!important; text-align:left!important; overflow-wrap:anywhere; word-break:normal; }\n  .tf-holding-table th:nth-child(2), .tf-holding-table td:nth-child(2),\n  .tf-holding-table th:nth-child(3), .tf-holding-table td:nth-child(3) { width:26%!important; text-align:center!important; }\n  .tf-holding-table th:nth-child(2), .tf-holding-table th:nth-child(3) { white-space:normal; }\n  .tf-holding-analyst { font-weight:700; line-height:1.35; }\n  .tf-holding-value {\n    white-space:nowrap;\n    text-align:center!important;\n    font-variant-numeric:tabular-nums;\n    font-feature-settings:"tnum" 1;\n    letter-spacing:0;\n  }\n'''
          pattern=re.compile(r"  \\.tf-holding-table \\{ width:100%; min-width:0!important; table-layout:fixed; font-size:11px; \\}.*?  \\.tf-holding-value \\{ white-space:nowrap; \\}\\n",re.S)
          s,n=pattern.subn(new,s,count=1)
          assert n==1, 'REV383 holding CSS block not found'
          css.write_text(s)
          mf=root/'manifest.json'
          m=json.loads(mf.read_text())
          m['version']='1.16.97'
          m['version_name']='REV384'
          m['description']='REV384: Holding Period columns precisely aligned across desktop/mobile, centered tabular duration values, no inner scrollbars, Table 3 glow disabled for performance, persistent imports, Analyst-Pair analytics, and mini neon cursor.'
          mf.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          readme=root/'README_REV384.md'
          readme.write_text('''# REV384\n\n- Holding Period table columns are strictly aligned using 48% / 26% / 26% geometry.\n- Nama Analis - Pair is left aligned; Max/Avg headers and values are centered.\n- Duration values use tabular numerals for stable alignment.\n- Both Holding tables remain free of internal scrollbars.\n- Table 3 History remains excluded from cursor-follow glow for performance.\n- Version: 1.16.97 / REV384.\n''')
          def sha(p): return hashlib.sha256((root/p).read_bytes()).hexdigest()
          integ=root/'assets/7b6af0cb4001a684.js'
          js=integ.read_text()
          block=f'''\n\n// REV384 final integrity overrides - precisely aligned Holding analytics.\nFILES['manifest.json'] = '{sha(Path('manifest.json'))}';\nFILES['assets/tf-mechanical-theme.css'] = '{sha(Path('assets/tf-mechanical-theme.css'))}';\nFILES['README_REV384.md'] = '{sha(Path('README_REV384.md'))}';\n'''
          assert '\nwindow.tfIntegrityReady =' in js
          js=js.replace('\nwindow.tfIntegrityReady =',block+'\nwindow.tfIntegrityReady =',1)
          integ.write_text(js)
          PY
          node --check /tmp/tf-rev384/src/assets/4b4d6b8dc315a95c.js
          node --check /tmp/tf-rev384/src/assets/7b6af0cb4001a684.js
      - name: Validate integrity and build ZIP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,json
          root=Path('/tmp/tf-rev384/src')
          js=(root/'assets/7b6af0cb4001a684.js').read_text()
          entries={}
          objm=re.search(r'const FILES = \\{(.*?)\\};',js,re.S)
          assert objm
          for m in re.finditer(r'["\\\']([^"\\\']+)["\\\']\\s*:\\s*["\\\']([0-9a-f]{64})["\\\']',objm.group(1)): entries[m.group(1)]=m.group(2)
          pat=re.compile(r"FILES\\[(?:'([^']+)'|\\\"([^\\\"]+)\\\")\\]\\s*=\\s*(?:'([0-9a-f]{64})'|\\\"([0-9a-f]{64})\\\")")
          for m in pat.finditer(js,objm.end()): entries[m.group(1) or m.group(2)]=m.group(3) or m.group(4)
          for p,h in entries.items():
              fp=root/p
              assert fp.exists(), p
              assert hashlib.sha256(fp.read_bytes()).hexdigest()==h, p
          css=(root/'assets/tf-mechanical-theme.css').read_text()
          assert 'td:nth-child(2)' in css and 'td:nth-child(3)' in css
          assert 'font-variant-numeric:tabular-nums' in css
          assert 'text-align:center!important' in css
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']=='1.16.97' and m['version_name']=='REV384'
          print('REV384 PC validation PASS',len(entries),'protected files')
          PY
          OUT=/tmp/TF_Extension_PC_MAC_REV384_HOLDING_ALIGNMENT_FIX.zip
          cd /tmp/tf-rev384/src
          zip -qr "$OUT" .
          unzip -tq "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
      - name: Publish REV384 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.16.97
          TITLE='TF Analyzer Analyst v1.16.97 — REV384'
          OUT=/tmp/TF_Extension_PC_MAC_REV384_HOLDING_ALIGNMENT_FIX.zip
          NOTES=deliverables/RELEASE_NOTES_REV384.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --latest
            gh release upload "$TAG" "$OUT" "$OUT.sha256" --clobber
          else
            gh release create "$TAG" "$OUT" "$OUT.sha256" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --latest
          fi
