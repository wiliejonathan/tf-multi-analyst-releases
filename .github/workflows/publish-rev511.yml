name: Publish REV511 separate filter outlines and compact dashboard
on:
  push:
    branches: [main]
    paths: ['release-staging/REV511/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf511/src
          gh release download v1.18.23 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV510_MULTI_LINK.zip --output /tmp/tf511/base.zip
          echo '23f806c630216ace4aa053da7c58d0b148970706832a1e7a0eae8a44ddc6b3e4  /tmp/tf511/base.zip' | sha256sum -c -
          unzip -q /tmp/tf511/base.zip -d /tmp/tf511/src
          python3 release-staging/REV511/patch511.py /tmp/tf511/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf511/src node release-staging/REV511/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf511/src node release-staging/REV511/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf511/src node release-staging/REV511/test-lot511.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf511/src node release-staging/REV511/test-viewer511.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf511/src node release-staging/REV511/test-integration511.cjs
          (cd /tmp/tf511/src && zip -qr /tmp/TF_Extension_PC_MAC_REV511_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.24 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.24 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.24 — REV511' --notes-file release-staging/REV511/RELEASE_NOTES.md --latest
            gh release upload v1.18.24 /tmp/TF_Extension_PC_MAC_REV511_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.24 /tmp/TF_Extension_PC_MAC_REV511_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.24 — REV511' --notes-file release-staging/REV511/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.24" > /tmp/tf511/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf511/previous.json
          python3 release-staging/REV511/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf511/latest-request.json


