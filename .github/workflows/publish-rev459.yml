name: Publish REV459 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV459/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf459/src
          gh release download v1.17.71 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV458_MULTI_LINK.zip --output /tmp/tf459/base.zip
          echo 'd27afdf43a72eb2f5d914eec46efb2d72ae94950a7ac5c991a7a91317e0a4b9f  /tmp/tf459/base.zip' | sha256sum -c -
          unzip -q /tmp/tf459/base.zip -d /tmp/tf459/src
          python3 release-staging/REV459/patch459.py /tmp/tf459/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf459/src node release-staging/REV459/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf459/src node release-staging/REV459/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf459/src node release-staging/REV459/test-rev457.js
          TF_REV419_ROOT=/tmp/tf459/src node release-staging/REV459/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf459/src node release-staging/REV459/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf459/src node release-staging/REV459/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf459/src node release-staging/REV459/test-export459.cjs
          find /tmp/tf459/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf459/src && zip -qr /tmp/TF_Extension_PC_MAC_REV459_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.72 /tmp/TF_Extension_PC_MAC_REV459_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.72 — REV459' --notes-file release-staging/REV459/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.72" > /tmp/tf459/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf459/previous.json
          python3 release-staging/REV459/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf459/latest-request.json
