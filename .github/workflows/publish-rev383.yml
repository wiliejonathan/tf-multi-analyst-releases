name: Publish PC REV383 holding UI performance fix
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV383/READY'
permissions:
  contents: write
concurrency:
  group: publish-pc-rev383
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch REV379 baseline and build REV383
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v1.16.92 --pattern 'TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' --output base.zip
          echo '531d5cbe418af77d4e32d987161b4bbf6166ed3390691954a9b8260d55686ac8  base.zip' | sha256sum -c -
          python3 build_release_rev383.py base.zip
      - name: Validate packaged extension
        run: |
          set -euo pipefail
          rm -rf extension
          unzip -q deliverables/TF_Extension_PC_MAC_REV383_HOLDING_NO_SCROLL_HISTORY_PERF_FIX.zip -d extension
          unzip -tq deliverables/TF_Extension_PC_MAC_REV383_HOLDING_NO_SCROLL_HISTORY_PERF_FIX.zip
          node --check extension/assets/4b4d6b8dc315a95c.js
          node --check extension/assets/927ecbd63036f61b.js
          node --check extension/assets/tf-table-glow.js
          node --check extension/assets/7b6af0cb4001a684.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('extension')
          m=json.loads((root/'manifest.json').read_text())
          assert m['version']=='1.16.96'
          assert m['version_name']=='REV383'
          core=(root/'assets/4b4d6b8dc315a95c.js').read_text()
          side=(root/'assets/927ecbd63036f61b.js').read_text()
          css=(root/'assets/tf-mechanical-theme.css').read_text()
          glow=(root/'assets/tf-table-glow.js').read_text()
          assert 'TABLE ANALYTICS' in core and 'Nama Analis - Pair' in core
          assert 'tf_holdingAllTickerRows = baseRows.slice()' in core
          assert 'tf_filterRowsByUnifiedDate(baseRows)' in core
          assert 'tf_buildRememberedLinksFromImportedSources' in side
          assert "'tfMonthlyStats', 'tfHistorySignals'" in side
          assert '.tf-holding-card { min-width:0;overflow:visible!important' in css
          assert '.tf-holding-table { width:100%;min-width:0!important;table-layout:fixed' in css
          assert 'text-align:center!important' in css
          assert "el.closest&&el.closest(HISTORY_SECTION)" in glow
          assert "root.closest&&root.closest(HISTORY_SECTION)" in glow
          loader=(root/'assets/7b6af0cb4001a684.js').read_text()
          base=json.loads(re.search(r'const FILES = (\{.*?\});',loader,re.S).group(1))
          for p,d in re.findall(r'FILES\[[\"\']([^\"\']+)[\"\']\]\s*=\s*[\"\']([0-9a-f]{64})[\"\']\s*;',loader):
              base[p]=d
          bad=[]
          for p,d in base.items():
              f=root/p
              actual=hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else 'MISSING'
              if actual!=d: bad.append((p,d,actual))
          assert not bad,bad[:10]
          print('REV383 protected integrity PASS:',len(base))
          PY
          sha256sum -c deliverables/TF_Extension_PC_MAC_REV383_HOLDING_NO_SCROLL_HISTORY_PERF_FIX.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v1.16.96
          ZIP=deliverables/TF_Extension_PC_MAC_REV383_HOLDING_NO_SCROLL_HISTORY_PERF_FIX.zip
          SHA=$ZIP.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst v1.16.96 — REV383' --notes-file deliverables/RELEASE_NOTES_REV383.md --latest
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst v1.16.96 — REV383' --notes-file deliverables/RELEASE_NOTES_REV383.md --latest
          fi
      - name: Publish updater metadata
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.16.96 > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release.json').read_text())
          name='TF_Extension_PC_MAC_REV383_HOLDING_NO_SCROLL_HISTORY_PERF_FIX.zip'
          a=next(x for x in r['assets'] if x['name']==name)
          sha=Path('deliverables/'+name+'.sha256').read_text().split()[0]
          data={
            'schema':1,'available':True,'revision':383,'tag_name':r['tag_name'],
            'release_url':r['html_url'],'published_at':r['published_at'],
            'asset':{'id':a['id'],'name':a['name'],'url':a['browser_download_url'],
                     'size':a['size'],'digest':a.get('digest','') or ('sha256:'+sha),
                     'updated_at':a['updated_at']}
          }
          Path('/tmp/latest-rev383.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          cp /tmp/latest-rev383.json latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m 'Publish verified REV383 update metadata'
          git push origin HEAD:main
