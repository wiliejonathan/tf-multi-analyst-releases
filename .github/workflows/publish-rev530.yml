name: Publish REV530 template tutorials and Opened outcome paths
on:
  push:
    branches: [main]
    paths: ['release-staging/REV530/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf530/src
          gh release download v1.18.41 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV528_MULTI_LINK.zip --output /tmp/tf530/base.zip
          echo 'e75365c6f27c1ccf90d4a810ae9ca9c104bc9405766cdc6832dd9d633a82fa00  /tmp/tf530/base.zip' | sha256sum -c -
          unzip -q /tmp/tf530/base.zip -d /tmp/tf530/src
          python3 release-staging/REV530/patch530.py /tmp/tf530/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-unload525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-lot525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-viewer525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-integration525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-performance525.cjs
          TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-core-performance525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-history525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-smooth525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-stability525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-opened525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-cancelled525.cjs
          mkdir -p work/report528 work/report530
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-navigation528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-builder528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-template528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-source528.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf530/src node release-staging/REV530/test-ui530.cjs
          (cd /tmp/tf530/src && zip -qr /tmp/TF_Extension_PC_MAC_REV530_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.43 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.43 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.43 — REV530' --notes-file release-staging/REV530/RELEASE_NOTES.md --latest
            gh release upload v1.18.43 /tmp/TF_Extension_PC_MAC_REV530_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.43 /tmp/TF_Extension_PC_MAC_REV530_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.43 — REV530' --notes-file release-staging/REV530/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.43" > /tmp/tf530/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf530/previous.json
          python3 release-staging/REV530/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf530/latest-request.json


