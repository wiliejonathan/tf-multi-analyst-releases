name: Finalize REV412 release metadata
on:
  push:
    branches: [main]
    paths: ['release-staging/REV412/FINALIZE']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Correct release title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v1.17.25 --title 'TF Analyzer Analyst v1.17.25 — REV412 Equity and iSignal Overview' --latest
