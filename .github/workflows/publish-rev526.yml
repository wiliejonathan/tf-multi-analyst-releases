name: Publish REV526 indicator layout, filenames and history-gap mapping
on:
  push:
    branches: [main]
    paths: ['release-staging/REV526/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf526/src
          gh release download v1.18.38 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV525_MULTI_LINK.zip --output /tmp/tf526/base.zip
          echo '18625ba0a861b7189822b834b500903a56a78e15cc0857e76d3c448d07a4f25e  /tmp/tf526/base.zip' | sha256sum -c -
          unzip -q /tmp/tf526/base.zip -d /tmp/tf526/src
          python3 release-staging/REV526/patch526.py /tmp/tf526/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-unload525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-lot525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-viewer525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-integration525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-performance525.cjs
          TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-core-performance525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-history525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-smooth525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-stability525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-opened525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-cancelled525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-builder525.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf526/src node release-staging/REV526/test-builder526.cjs
          (cd /tmp/tf526/src && zip -qr /tmp/TF_Extension_PC_MAC_REV526_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.39 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.39 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.39 — REV526' --notes-file release-staging/REV526/RELEASE_NOTES.md --latest
            gh release upload v1.18.39 /tmp/TF_Extension_PC_MAC_REV526_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.39 /tmp/TF_Extension_PC_MAC_REV526_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.39 — REV526' --notes-file release-staging/REV526/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.39" > /tmp/tf526/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf526/previous.json
          python3 release-staging/REV526/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf526/latest-request.json


