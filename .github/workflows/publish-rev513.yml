name: Publish REV513 Monday outlines, hourly comparisons and monthly trade details
on:
  push:
    branches: [main]
    paths: ['release-staging/REV513/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf513/src
          gh release download v1.18.25 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV512_MULTI_LINK.zip --output /tmp/tf513/base.zip
          echo 'd65a7514b0833de93183744e16cf5865e93208e3469e2934f0809241b8373c31  /tmp/tf513/base.zip' | sha256sum -c -
          unzip -q /tmp/tf513/base.zip -d /tmp/tf513/src
          python3 release-staging/REV513/patch513.py /tmp/tf513/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf513/src node release-staging/REV513/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf513/src node release-staging/REV513/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf513/src node release-staging/REV513/test-lot513.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf513/src node release-staging/REV513/test-viewer513.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf513/src node release-staging/REV513/test-integration513.cjs
          (cd /tmp/tf513/src && zip -qr /tmp/TF_Extension_PC_MAC_REV513_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.26 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.26 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.26 — REV513' --notes-file release-staging/REV513/RELEASE_NOTES.md --latest
            gh release upload v1.18.26 /tmp/TF_Extension_PC_MAC_REV513_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.26 /tmp/TF_Extension_PC_MAC_REV513_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.26 — REV513' --notes-file release-staging/REV513/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.26" > /tmp/tf513/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf513/previous.json
          python3 release-staging/REV513/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf513/latest-request.json


