name: Publish REV524 stabilize rapid filter interactions
on:
  push:
    branches: [main]
    paths: ['release-staging/REV524/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf524/src
          gh release download v1.18.36 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV523_MULTI_LINK.zip --output /tmp/tf524/base.zip
          echo '0ebb429ebe41abc563bf25c11363bc7e67726b1e541da6ee6734e97de5c3f156  /tmp/tf524/base.zip' | sha256sum -c -
          unzip -q /tmp/tf524/base.zip -d /tmp/tf524/src
          python3 release-staging/REV524/patch524.py /tmp/tf524/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-unload524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-lot524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-viewer524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-integration524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-performance524.cjs
          TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-core-performance524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-history524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-smooth524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-stability524.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf524/src node release-staging/REV524/test-opened524.cjs
          (cd /tmp/tf524/src && zip -qr /tmp/TF_Extension_PC_MAC_REV524_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.37 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.37 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.37 — REV524' --notes-file release-staging/REV524/RELEASE_NOTES.md --latest
            gh release upload v1.18.37 /tmp/TF_Extension_PC_MAC_REV524_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.37 /tmp/TF_Extension_PC_MAC_REV524_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.37 — REV524' --notes-file release-staging/REV524/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.37" > /tmp/tf524/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf524/previous.json
          python3 release-staging/REV524/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf524/latest-request.json


