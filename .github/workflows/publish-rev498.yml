name: Publish REV498 separate filter outlines and compact dashboard
on:
  push:
    branches: [main]
    paths: ['release-staging/REV498/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf498/src
          gh release download v1.17.85 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV472_MULTI_LINK.zip --output /tmp/tf498/base.zip
          echo 'ab12568ee3392201e567b9a8aa14653afadfeef5fcc881e0a60f25c9b4d0c32f  /tmp/tf498/base.zip' | sha256sum -c -
          unzip -q /tmp/tf498/base.zip -d /tmp/tf498/src
          python3 release-staging/REV498/patch498.py /tmp/tf498/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-recovery457.cjs
          TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-submit-worker498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-submit498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-pairs498.cjs
          TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-flow498.cjs
          TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-rank498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-empty498.cjs
          TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-profit498.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-switch498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-report498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-scroll498.cjs
          TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-stop498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-stop-ui498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-report498.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf498/src node release-staging/REV498/test-scroll498.cjs
          find /tmp/tf498/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf498/src && zip -qr /tmp/TF_Extension_PC_MAC_REV498_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.11 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.11 — REV498' --notes-file release-staging/REV498/RELEASE_NOTES.md --latest
            gh release upload v1.18.11 /tmp/TF_Extension_PC_MAC_REV498_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.11 /tmp/TF_Extension_PC_MAC_REV498_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.11 — REV498' --notes-file release-staging/REV498/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.11" > /tmp/tf498/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf498/previous.json
          python3 release-staging/REV498/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf498/latest-request.json


