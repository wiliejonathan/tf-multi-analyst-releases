name: Update verified monthly market colors
on:
  push:
    branches: [main]
    paths: ['tools/update-market-regimes.py']
  schedule:
    - cron: '15 2 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: market-price-cache
          key: market-prices-${{ github.run_id }}
          restore-keys: market-prices-
      - name: Obtain prices and classify actual daily candles
        run: python tools/update-market-regimes.py
      - name: Commit verified data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-regimes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified monthly market regimes'
          git pull --rebase origin main
          git push origin HEAD:main
