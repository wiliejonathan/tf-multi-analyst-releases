name: Publish REV472 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV472/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf472/src
          gh release download v1.17.81 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV468_MULTI_LINK.zip --output /tmp/tf472/base.zip
          echo 'bd9c6b36938d3981ad7946d1df278e2348eed476531fa6004ab00a895577bc98  /tmp/tf472/base.zip' | sha256sum -c -
          unzip -q /tmp/tf472/base.zip -d /tmp/tf472/src
          python3 release-staging/REV472/patch472.py /tmp/tf472/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-rev457.js
          TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-summary463.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-losing464.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-picker465.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-compact466.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-progress467.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-rescan468.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf472/src node release-staging/REV472/test-report472.cjs
          find /tmp/tf472/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf472/src && zip -qr /tmp/TF_Extension_PC_MAC_REV472_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.85 /tmp/TF_Extension_PC_MAC_REV472_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.85 — REV472' --notes-file release-staging/REV472/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.85" > /tmp/tf472/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf472/previous.json
          python3 release-staging/REV472/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf472/latest-request.json
