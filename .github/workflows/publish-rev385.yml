name: Publish PC Mac REV385 Holding Table3 source fix
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV385/READY'
permissions:
  contents: write
concurrency:
  group: publish-pc-rev385
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download REV384 hash-fixed base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev385
          rm -rf "$ROOT" && mkdir -p "$ROOT/src"
          gh release download v1.16.97 --repo "$GITHUB_REPOSITORY" --pattern 'TF_Extension_PC_MAC_REV384_HOLDING_ALIGNMENT_FIX.zip' --output "$ROOT/base.zip"
          unzip -tq "$ROOT/base.zip"
          unzip -q "$ROOT/base.zip" -d "$ROOT/src"
      - name: Patch REV385
        run: |
          set -euo pipefail
          python3 tools/build_rev385.py /tmp/tf-rev385/src
          node --check /tmp/tf-rev385/src/assets/4b4d6b8dc315a95c.js
          node --check /tmp/tf-rev385/src/assets/7b6af0cb4001a684.js
      - name: Validate exact Table3 source and integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path('/tmp/tf-rev385/src')
          main=(root/'assets/4b4d6b8dc315a95c.js').read_text()
          assert 'tf_parseHistoryTableDateMs' in main
          assert 'tf_renderHoldingPeriodTables(rowsForUi)' in main
          assert 'tf_holdingAllTickerRows' not in main
          assert 'row.createdDate' in main and 'row.displayDate' in main
          loader=(root/'assets/7b6af0cb4001a684.js').read_text()
          m=re.search(r'const FILES = (\{.*?\});\n// The integrity loader',loader,re.S); assert m
          d=json.loads(m.group(1)); bad=[]
          for p,h in d.items():
              fp=root/p
              if not fp.is_file(): bad.append((p,'missing')); continue
              a=hashlib.sha256(fp.read_bytes()).hexdigest()
              if a!=h: bad.append((p,a,h))
          assert not bad,bad[:10]
          assert len(d)>=236
          print('REV385 integrity PASS',len(d),'protected files')
          PY
      - name: Package
        run: |
          set -euo pipefail
          OUT=/tmp/TF_Extension_PC_MAC_REV385_HOLDING_TABLE3_SOURCE_FIX.zip
          cd /tmp/tf-rev385/src
          zip -qr "$OUT" .
          unzip -tq "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          printf '%s  %s\n' "$SHA" 'TF_Extension_PC_MAC_REV385_HOLDING_TABLE3_SOURCE_FIX.zip' > "$OUT.sha256"
          echo "PC_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publish stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.16.98
          OUT=/tmp/TF_Extension_PC_MAC_REV385_HOLDING_TABLE3_SOURCE_FIX.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst v1.16.98 — REV385' --notes-file deliverables/RELEASE_NOTES_REV385.md --latest
            gh release upload "$TAG" "$OUT" "$OUT.sha256" --clobber
          else
            gh release create "$TAG" "$OUT" "$OUT.sha256" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst v1.16.98 — REV385' --notes-file deliverables/RELEASE_NOTES_REV385.md --latest
          fi
          echo "REV385 PC published SHA256=$PC_SHA"
