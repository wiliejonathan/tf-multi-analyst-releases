name: Publish REV458 scalable scan recovery
on:
  push:
    branches: [main]
    paths: ['release-staging/REV458/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf458/src
          gh release download v1.17.70 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV457_MULTI_LINK.zip --output /tmp/tf458/base.zip
          echo '706db8688a58b1de0d11b63d2481f0efbd30c0582801ecce66422773be305543  /tmp/tf458/base.zip' | sha256sum -c -
          unzip -q /tmp/tf458/base.zip -d /tmp/tf458/src
          python3 release-staging/REV458/patch458.py /tmp/tf458/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf458/src node release-staging/REV458/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf458/src node release-staging/REV458/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf458/src node release-staging/REV458/test-rev457.js
          TF_REV419_ROOT=/tmp/tf458/src node release-staging/REV458/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf458/src node release-staging/REV458/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf458/src node release-staging/REV458/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf458/src node release-staging/REV458/test-export458.cjs
          find /tmp/tf458/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf458/src && zip -qr /tmp/TF_Extension_PC_MAC_REV458_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.17.71 /tmp/TF_Extension_PC_MAC_REV458_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.71 — REV458' --notes-file release-staging/REV458/RELEASE_NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.71" > /tmp/tf458/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf458/previous.json
          python3 release-staging/REV458/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf458/latest-request.json
