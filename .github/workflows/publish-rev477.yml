name: Publish REV477 dashboard performance and compact adjustment
on:
  push:
    branches: [main]
    paths: ['release-staging/REV477/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf477/src
          gh release download v1.17.85 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV472_MULTI_LINK.zip --output /tmp/tf477/base.zip
          echo 'ab12568ee3392201e567b9a8aa14653afadfeef5fcc881e0a60f25c9b4d0c32f  /tmp/tf477/base.zip' | sha256sum -c -
          unzip -q /tmp/tf477/base.zip -d /tmp/tf477/src
          python3 release-staging/REV477/patch477.py /tmp/tf477/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-rev457.js
          TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-summary463.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-losing464.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-picker465.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-compact466.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-progress467.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-rescan468.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-report477.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-performance477.cjs
          TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-risk477.cjs
          TF_REV419_ROOT=/tmp/tf477/src node release-staging/REV477/test-switches477.cjs
          find /tmp/tf477/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf477/src && zip -qr /tmp/TF_Extension_PC_MAC_REV477_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.17.90 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.17.90 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.90 — REV477' --notes-file release-staging/REV477/RELEASE_NOTES.md --latest
            gh release upload v1.17.90 /tmp/TF_Extension_PC_MAC_REV477_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.17.90 /tmp/TF_Extension_PC_MAC_REV477_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.90 — REV477' --notes-file release-staging/REV477/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.90" > /tmp/tf477/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf477/previous.json
          python3 release-staging/REV477/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf477/latest-request.json

      - name: Publish matching iOS Browser download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf477-mobile/source /tmp/tf477-mobile/src /tmp/outputs
          gh api repos/wiliejonathan/tf-analyzer-analyst-ios/zipball/d15ddbec481696226b2bdd857d64aa3d14935d2e > /tmp/tf477-mobile/source.zip
          unzip -q /tmp/tf477-mobile/source.zip -d /tmp/tf477-mobile/source
          cp -a /tmp/tf477-mobile/source/*/. /tmp/tf477-mobile/src/
          cd /tmp/tf477-mobile/src
          node --check assets/tf-analyst-report.js
          TF_RISK_SOURCE=assets/dashboard-mobile.js node tests/test-risk477.cjs
          TF_RISK_SOURCE=assets/dashboard-mobile.js node tests/test-switches477.cjs
          npm install --no-save playwright
          TF_BROWSER_CHANNEL=chrome node tests/report477.cjs
          zip -qr /tmp/TF_Analyzer_Analyst_iOS_BROWSER_REV477.zip . -x '.github/*' 'release-staging/*' 'node_modules/*' 'package-lock.json' 'package.json'
          unzip -tq /tmp/TF_Analyzer_Analyst_iOS_BROWSER_REV477.zip
          gh release upload v1.17.90 /tmp/TF_Analyzer_Analyst_iOS_BROWSER_REV477.zip --repo wiliejonathan/tf-multi-analyst-releases --clobber
