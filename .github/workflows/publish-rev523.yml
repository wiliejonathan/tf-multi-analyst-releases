name: Publish REV523 smooth scrolling and redundant update optimization
on:
  push:
    branches: [main]
    paths: ['release-staging/REV523/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf523/src
          gh release download v1.18.35 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV522_MULTI_LINK.zip --output /tmp/tf523/base.zip
          echo '8aba45b752f3de8c6ed2864dc9708be3738388969c12fa6181607454c8f4db76  /tmp/tf523/base.zip' | sha256sum -c -
          unzip -q /tmp/tf523/base.zip -d /tmp/tf523/src
          python3 release-staging/REV523/patch523.py /tmp/tf523/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-unload523.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-negative509.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-all508.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-lot523.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-viewer523.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-integration523.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-performance523.cjs
          TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-core-performance523.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-history523.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-smooth523.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf523/src node release-staging/REV523/test-opened523.cjs
          (cd /tmp/tf523/src && zip -qr /tmp/TF_Extension_PC_MAC_REV523_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.18.36 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.18.36 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.36 — REV523' --notes-file release-staging/REV523/RELEASE_NOTES.md --latest
            gh release upload v1.18.36 /tmp/TF_Extension_PC_MAC_REV523_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.18.36 /tmp/TF_Extension_PC_MAC_REV523_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.18.36 — REV523' --notes-file release-staging/REV523/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.18.36" > /tmp/tf523/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf523/previous.json
          python3 release-staging/REV523/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf523/latest-request.json


