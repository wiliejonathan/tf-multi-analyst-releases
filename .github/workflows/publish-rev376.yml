name: Publish PC REV376 login-required auto-resume
on:
  push:
    paths:
      - 'release-staging/REV376/READY'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-pc-rev376
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify REV375 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.16.88 --pattern 'TF_Extension_PC_MAC_REV375_ACTIVATION_TIMEOUT_RECOVERY.zip' --output base.zip
          echo '7db454af35f7fd052084cd5902ede721f77053b24e758901b78ba7ffee726b4b  base.zip' | sha256sum -c -
          python3 build_release_rev376.py base.zip
          echo 'dad69055e400af60141d9eff16af312bae100d9af6a3439c8a8b240726b65520  deliverables/TF_Extension_PC_MAC_REV376_LOGIN_REQUIRED_AUTO_RESUME.zip' | sha256sum -c -
      - name: Validate packaged extension
        run: |
          rm -rf extension
          unzip -q deliverables/TF_Extension_PC_MAC_REV376_LOGIN_REQUIRED_AUTO_RESUME.zip -d extension
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root=Path('extension')
          loaders=[]
          for p in (root/'assets').glob('*.js'):
              s=p.read_text(errors='ignore')
              if 'const FILES =' in s and 'window.tfIntegrityReady' in s:
                  loaders.append(p)
          assert len(loaders)==1, loaders
          s=loaders[0].read_text()
          files=json.loads(re.search(r'const FILES = (\{.*?\});',s,re.S).group(1))
          for path,digest in re.findall(r'FILES\[["\']([^"\']+)["\']\]\s*=\s*["\']([0-9a-f]{64})["\']\s*;',s):
              files[path]=digest
          mismatch=[]
          for path,expected in files.items():
              f=root/path
              actual=hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else 'MISSING'
              if actual!=expected: mismatch.append((path,expected,actual))
          assert not mismatch, mismatch
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['version']=='1.16.89'
          assert manifest['version_name']=='REV376'
          popup=(root/'assets/927ecbd63036f61b.js').read_text()
          bg=(root/'assets/901c62026afc22f4.js').read_text()
          scan=(root/'assets/dec74fd654ec6d54.js').read_text()
          assert 'tfResumeAfterLoginV1' in popup
          assert "tf_forceLoginViewForResume('update'" in popup
          assert "tf_forceLoginViewForResume('dashboardSubmit'" in popup
          assert "tf_forceLoginViewForResume('isignalSubmit'" in popup
          assert '__tfResumePendingActionAfterLogin' in popup
          assert "const deferableDuringScan = logoutReason === 'NAVBAR_LOGGED_OUT' || logoutReason === 'PERIODIC_CHECK';" in popup
          assert 'tfResumeAfterLoginV1' in bg and 'session_expired_login_required' in bg
          assert 'function tf_hasLoginRequiredAlert()' in scan
          assert 'tfLoginRequiredObserver' in scan
          assert 'loginAlerts = doc ? Array.from' in scan
          print('Protected integrity PASS:',len(files),'entries')
          print('REV376 login-required auto-resume checks PASS')
          PY
          for file in extension/assets/*.js; do node --check "$file"; done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.16.89 >/dev/null 2>&1; then
            echo 'Release v1.16.89 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.16.89 deliverables/TF_Extension_PC_MAC_REV376_LOGIN_REQUIRED_AUTO_RESUME.zip --target "$GITHUB_SHA" --title 'TF Analyzer Analyst v1.16.89 — REV376 Login Required Auto Resume' --notes-file deliverables/RELEASE_NOTES_REV376.md --latest
      - name: Publish update metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.16.89 > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('release.json').read_text())
          a=next(a for a in r['assets'] if a['name']=='TF_Extension_PC_MAC_REV376_LOGIN_REQUIRED_AUTO_RESUME.zip')
          assert a['state']=='uploaded' and a['size']>0
          data={'schema':1,'available':True,'revision':376,'tag_name':r['tag_name'],'release_url':r['html_url'],'published_at':r['published_at'],'asset':{'id':a['id'],'name':a['name'],'url':a['browser_download_url'],'size':a['size'],'digest':a.get('digest',''),'updated_at':a['updated_at']}}
          Path('/tmp/latest-rev376.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          cp /tmp/latest-rev376.json latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m 'Publish verified REV376 update metadata'
          git push origin HEAD:main
