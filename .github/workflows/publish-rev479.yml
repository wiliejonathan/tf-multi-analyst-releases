name: Publish REV479 dashboard performance and compact adjustment
on:
  push:
    branches: [main]
    paths: ['release-staging/REV479/READY']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf479/src
          gh release download v1.17.85 --repo "$GITHUB_REPOSITORY" --pattern TF_Extension_PC_MAC_REV472_MULTI_LINK.zip --output /tmp/tf479/base.zip
          echo 'ab12568ee3392201e567b9a8aa14653afadfeef5fcc881e0a60f25c9b4d0c32f  /tmp/tf479/base.zip' | sha256sum -c -
          unzip -q /tmp/tf479/base.zip -d /tmp/tf479/src
          python3 release-staging/REV479/patch479.py /tmp/tf479/src
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-progress455.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-pair456.cjs
          TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-rev457.js
          TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-lifecycle456.cjs
          TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-scale457.cjs
          TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-recovery457.cjs
          mkdir -p outputs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-export459.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-losing460.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-columns461.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-rows462.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-summary463.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-losing464.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-picker465.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-compact466.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-progress467.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-rescan468.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-report479.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-performance479.cjs
          TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-risk479.cjs
          TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-switches479.cjs
          CI=1 TF_REV419_ROOT=/tmp/tf479/src node release-staging/REV479/test-skip479.cjs
          find /tmp/tf479/src -name '*.js' -print0 | xargs -0 -n1 node --check
          (cd /tmp/tf479/src && zip -qr /tmp/TF_Extension_PC_MAC_REV479_MULTI_LINK.zip .)
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.17.92 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.17.92 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.92 — REV479' --notes-file release-staging/REV479/RELEASE_NOTES.md --latest
            gh release upload v1.17.92 /tmp/TF_Extension_PC_MAC_REV479_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.17.92 /tmp/TF_Extension_PC_MAC_REV479_MULTI_LINK.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF Multi-Analyst Scanner v1.17.92 — REV479' --notes-file release-staging/REV479/RELEASE_NOTES.md --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.17.92" > /tmp/tf479/release.json
          gh api "repos/$GITHUB_REPOSITORY/contents/latest.json" > /tmp/tf479/previous.json
          python3 release-staging/REV479/update-latest.py
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest.json" --input /tmp/tf479/latest-request.json

